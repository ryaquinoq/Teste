<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um Presente Especial Para Você</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
        }
        .app-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        .vault-wrapper {
            perspective: 1000px; /* Para efeito 3D na porta */
        }
        .vault-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 2rem 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            width: 90%;
            max-width: 380px; /* Levemente menor para acomodar melhor o SVG */
            transition: transform 0.7s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.7s ease-out;
            position: relative; /* Para z-index se necessário */
            z-index: 10;
        }

        /* Estilo para o SVG do Cofre */
        .vault-svg-container {
            width: 150px; /* Ajuste conforme necessário */
            height: 150px;
            margin: 0 auto 1.5rem auto;
            position: relative;
        }

        .vault-body { fill: #8a8a8a; /* Cinza ardósia */ }
        .vault-door {
            fill: #b0b0b0; /* Cinza mais claro */
            stroke: #606060; /* Cinza escuro para contorno */
            stroke-width: 2;
            transform-origin: left center; /* Ponto de rotação da porta */
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .vault-door.open {
            transform: rotateY(-110deg) translateX(-5px) scaleX(1.05); /* Efeito de abertura da porta */
        }
        .dial-plate { fill: #f5f5f5; /* Cinza bem claro */ }
        .dial-center { fill: #dcdcdc; /* Cinza médio */ }
        .handle-base { fill: #dcdcdc; }
        .handle-grip {
             fill: #8a8a8a;
             /* transition: transform 0.3s ease-in-out; */ /* Replaced by keyframe animation */
        }
        .vault-container.opening .handle-grip {
            /* transform: rotate(90deg); */ /* Replaced by keyframe animation */
            animation: handleTurnAndClick 0.5s ease-out forwards;
            transform-origin: 100px 105px; /* Ensure this is the correct center for the handle grip */
        }
        .hinge { fill: #606060; }


        .romantic-title {
            font-family: 'Pacifico', cursive;
            color: #a30052;
            font-size: 1.75rem;
            margin-bottom: 1.5rem;
        }
        input[type="password"] {
            border: 2px solid #ff8fab;
            border-radius: 0.5rem;
            padding: 0.75rem;
            width: 100%;
            margin-bottom: 1rem;
            text-align: center;
            font-size: 1.125rem;
            box-sizing: border-box;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: #ff69b4;
            box-shadow: 0 0 0 3px rgba(255, 105, 180, 0.4);
        }
        .btn-open {
            background-color: #ff69b4;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            width: 100%;
            font-size: 1rem;
        }
        .btn-open:hover {
            background-color: #e0529d;
            transform: translateY(-2px);
        }
        .btn-open:active {
            transform: translateY(0px);
        }

        .message-container {
            text-align: center;
            opacity: 0;
            transform: scale(0.7) translateY(20px);
            transition: opacity 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: absolute; /* Centraliza após o cofre sumir */
            width: 90%;
            max-width: 500px;
            z-index: 5; /* Abaixo do cofre inicialmente */
        }
        .message-container.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        .love-message {
            font-family: 'Pacifico', cursive;
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
            margin-bottom: 2rem;
            line-height: 1.3;
        }
        .heart {
            position: absolute;
            bottom: -60px;
            font-size: 1.2rem; /* Tamanho base */
            color: #ff1493;
            animation: floatUp 4s linear forwards; /* Duração base */
            user-select: none;
            pointer-events: none;
            opacity: 0; /* Começa invisível para fade in */
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.7) rotate(0deg);
                opacity: 0.7;
            }
            20% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) scale(1.3) rotate(20deg); /* Sobe mais e escala mais */
                opacity: 0;
            }
        }

        .error-message {
            color: #e53e3e;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            height: 1.25rem;
        }

        @media (min-width: 640px) {
            .vault-container {
                padding: 2.5rem 2rem;
            }
            .vault-svg-container {
                width: 180px;
                height: 180px;
            }
            .romantic-title {
                font-size: 2.25rem;
            }
            input[type="password"] {
                font-size: 1.25rem;
            }
            .btn-open {
                font-size: 1.125rem;
            }
            .love-message {
                font-size: 3.5rem;
            }
            .heart {
                font-size: 1.5rem; /* Tamanho base maior */
            }
        }
        /* Animação de shake para erro */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-6px); }
            20%, 40%, 60%, 80% { transform: translateX(6px); }
        }
        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* Keyframes for dial wobble */
        @keyframes dialWobble {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            50% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
            100% { transform: rotate(0deg); }
        }

        /* Apply dial wobble animation when input is focused */
        .vault-svg-container.dial-animating .dial-plate,
        .vault-svg-container.dial-animating #vaultDialMarker {
            animation: dialWobble 0.7s ease-in-out infinite;
            transform-origin: 100px 100px; /* SVG coordinates for dial center */
        }

        /* Keyframes for enhanced handle turn */
        @keyframes handleTurnAndClick {
            0% { transform: rotate(0deg) scale(1); }
            70% { transform: rotate(145deg) scale(1.1); } /* Overshoot rotation slightly and scale up */
            90% { transform: rotate(130deg) scale(1.05); } /* Bounce back rotation */
            100% { transform: rotate(135deg) scale(1); } /* Settle to final rotation */
        }

        /* Keyframes for message pulsing/glowing effect */
        @keyframes pulseGlow {
            0% { text-shadow: 2px 2px 8px rgba(0,0,0,0.5), 0 0 10px rgba(255, 182, 193, 0.5); } /* LightPink base glow */
            50% { text-shadow: 2px 2px 12px rgba(0,0,0,0.6), 0 0 25px rgba(255, 182, 193, 1); } /* Brighter LightPink glow */
            100% { text-shadow: 2px 2px 8px rgba(0,0,0,0.5), 0 0 10px rgba(255, 182, 193, 0.5); }
        }

        .love-message.message-pulsing {
            animation: pulseGlow 2s ease-in-out infinite;
        }

        .confetti-particle {
            position: fixed;
            pointer-events: none;
            z-index: 1000; /* Ensure confetti is on top */
        }
    </style>
</head>
<body>
    <div id="appContainer" class="app-container">
        <div class="vault-wrapper">
            <div id="vaultContainer" class="vault-container">
                <div class="vault-svg-container">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <rect x="20" y="20" width="160" height="160" rx="10" class="vault-body"/>
                        <rect id="vaultDoorSvg" x="25" y="25" width="150" height="150" rx="5" class="vault-door"/>
                        <rect x="18" y="40" width="10" height="20" rx="2" class="hinge"/>
                        <rect x="18" y="140" width="10" height="20" rx="2" class="hinge"/>
                        <circle cx="100" cy="100" r="35" class="dial-plate"/>
                        <circle cx="100" cy="100" r="15" class="dial-center"/>
                        <line id="vaultDialMarker" x1="100" y1="70" x2="100" y2="80" stroke="#606060" stroke-width="3"/>
                        <rect x="95" y="90" width="10" height="30" rx="2" class="handle-base" transform="translate(50, 15)"/> <rect id="handleGripSvg" x="85" y="115" width="30" height="10" rx="3" class="handle-grip" transform="translate(50, 15)"/> </svg>
                </div>
                <h1 class="romantic-title">Um Segredo Para Você</h1>
                <input type="password" id="passwordInput" placeholder="Digite a senha especial">
                <div id="errorMessage" class="error-message"></div>
                <button id="openVaultButton" class="btn-open">Abrir o Cofre</button>
            </div>
        </div>

        <div id="messageContainer" class="message-container">
            <h2 id="loveMessageText" class="love-message">Eu te amo infinitamente!</h2>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('passwordInput');
        const openVaultButton = document.getElementById('openVaultButton');
        const vaultContainer = document.getElementById('vaultContainer');
        const messageContainer = document.getElementById('messageContainer');
        const loveMessageText = document.getElementById('loveMessageText');
        const errorMessage = document.getElementById('errorMessage');
        const vaultDoorSvg = document.getElementById('vaultDoorSvg');
        const handleGripSvg = document.getElementById('handleGripSvg'); // Para animar a maçaneta
        const vaultSvgContainer = document.querySelector('.vault-svg-container'); // For dial animation
        const correctPassword = "280921";

        const confettiColors = ['#ffd700', '#c0c0c0', '#ff69b4', '#87ceeb', '#9370db', '#f4a460'];

        function createConfettiParticle() {
            const particle = document.createElement('div');
            particle.classList.add('confetti-particle');
            
            particle.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
            const size = Math.random() * 7 + 8; // width/height between 8px and 15px
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';

            const messageRect = messageContainer.getBoundingClientRect();
            // Start confetti from roughly the center of where the vault was, or top of message area
            particle.style.left = (messageRect.left + messageRect.width / 2) + 'px'; 
            particle.style.top = (messageRect.top + messageRect.height / 3) + 'px';


            document.body.appendChild(particle);

            const angle = Math.random() * Math.PI * 2; // Random angle in radians
            const blastRadius = Math.random() * 150 + 80; // How far it shoots initially: 80 to 230px
            // Initial burst movement, predominantly upwards and outwards
            const initialX = Math.cos(angle) * blastRadius;
            const initialY = Math.sin(angle) * blastRadius - (blastRadius * 0.5); // Bias upwards

            const particleAnimationName = `confetti-particle-anim-${Date.now()}-${Math.random().toString(36).slice(2)}`;
            const fallToY = '110vh'; // Fall off screen
            const finalRotation = Math.random() * 720 - 360; // Random end rotation
            const swayX = Math.random() * 200 - 100; // Horizontal sway during fall

            const keyframes = `
            @keyframes ${particleAnimationName} {
                0% {
                    transform: translate(0px, 0px) rotateZ(0deg) scale(1);
                    opacity: 1;
                }
                20% { /* Initial burst movement */
                    transform: translate(${initialX}px, ${initialY}px) rotateZ(${finalRotation * 0.2}deg) scale(0.8);
                    opacity: 1;
                }
                100% {
                    transform: translate(${initialX + swayX}px, ${fallToY}) rotateZ(${finalRotation}deg) scale(0.3);
                    opacity: 0;
                }
            }`;
            const styleSheet = document.createElement("style");
            styleSheet.type = "text/css";
            styleSheet.innerText = keyframes;
            document.head.appendChild(styleSheet);

            particle.style.animation = `${particleAnimationName} ${Math.random() * 2 + 2.5}s linear forwards`; // Duration 2.5-4.5s

            particle.addEventListener('animationend', () => {
                particle.remove();
                styleSheet.remove();
            });
        }


        function createHeart() {
            const heartEmojis = ['❤️', '💖', '💕', '💓', '💗'];
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];

            heart.style.left = Math.random() * 100 + 'vw';
            const randomScale = Math.random() * 0.8 + 0.8; // entre 0.8 e 1.6
            // heart.style.transform = `scale(${randomScale})`; // Initial scale is set in keyframes 0%
            heart.style.animationDuration = (Math.random() * 3 + 3.5) + 's'; // entre 3.5s e 6.5s
            heart.style.animationDelay = (Math.random() * 0.5) + 's'; // Pequeno delay para não começarem todos juntos
            
            const targetTranslateY = -(100 + Math.random() * 20); // e.g., -100vh to -120vh
            const targetRotation = Math.random() * 90 - 45;    // -45deg to +45deg
            const targetTranslateX = Math.random() * 150 - 75;   // -75px to +75px
            const finalScaleFactor = 1.3 + Math.random() * 0.4; // between 1.3 and 1.7

            // Adiciona uma leve oscilação horizontal na animação
            const keyframes = `
                @keyframes floatUp-${Date.now()}-${Math.random()} {
                    0% {
                        transform: translateY(0) scale(${randomScale * 0.7}) rotate(0deg) translateX(0px);
                        opacity: 0;
                    }
                    20% {
                        opacity: ${Math.random() * 0.3 + 0.7}; /* Opacidade entre 0.7 e 1.0 */
                    }
                    100% {
                        transform: translateY(${targetTranslateY}vh) scale(${randomScale * finalScaleFactor}) rotate(${targetRotation}deg) translateX(${targetTranslateX}px);
                        opacity: 0;
                    }
                }
            `;
            const styleSheet = document.createElement("style");
            styleSheet.type = "text/css";
            styleSheet.innerText = keyframes;
            document.head.appendChild(styleSheet);
            heart.style.animationName = `floatUp-${Date.now()}-${Math.random()}`;


            document.body.appendChild(heart);

            heart.addEventListener('animationend', () => {
                heart.remove();
                styleSheet.remove(); // Limpa a keyframe da folha de estilo
            });
        }

        openVaultButton.addEventListener('click', () => {
            if (passwordInput.value === correctPassword) {
                errorMessage.textContent = '';
                vaultContainer.classList.add('opening'); // Adiciona classe para animar a maçaneta
                vaultDoorSvg.classList.add('open'); // Abre a porta do SVG

                // Atraso para a animação da porta acontecer antes do cofre sumir
                setTimeout(() => {
                    vaultContainer.style.transform = 'scale(0.7) rotateY(30deg)'; // Efeito de sumiço mais interessante
                    vaultContainer.style.opacity = '0';

                    setTimeout(() => {
                        vaultContainer.style.display = 'none';
                        messageContainer.classList.add('visible');
                        
                        const fullMessage = "Eu te amo infinitamente!";
                        loveMessageText.textContent = ''; // Clear current text for typing animation
                        let i = 0;
                        function typeCharacter() {
                            if (i < fullMessage.length) {
                                loveMessageText.textContent += fullMessage.charAt(i);
                                i++;
                                setTimeout(typeCharacter, 120); // Adjust typing speed (ms)
                            } else {
                                // Typing finished, add the pulsing effect class
                                loveMessageText.classList.add('message-pulsing');
                            }
                        }
                        typeCharacter(); // Start typing animation
                
                const numConfetti = 80; // Number of confetti particles
                for (let i = 0; i < numConfetti; i++) {
                    setTimeout(createConfettiParticle, i * 25); // Stagger their creation
                }

                        for(let i=0; i<15; i++) { setTimeout(createHeart, i * 100); } // Cria corações iniciais com um pequeno stagger
                        const heartInterval = setInterval(createHeart, 250); // Cria novos corações

                        // Opcional: parar de criar corações depois de um tempo
                        // setTimeout(() => clearInterval(heartInterval), 20000); // Para após 20 segundos
                    }, 700); // Tempo para o cofre sumir após a porta abrir

                }, 600); // Tempo para a porta do SVG abrir

            } else {
                errorMessage.textContent = 'Senha incorreta, tente novamente!';
                passwordInput.classList.add('animate-shake');
                setTimeout(() => {
                    passwordInput.classList.remove('animate-shake');
                }, 400);
                passwordInput.value = '';
                passwordInput.focus();
            }
        });

        passwordInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                openVaultButton.click();
            }
        });

        // Dial animation on input focus/blur
        passwordInput.addEventListener('focus', () => {
            vaultSvgContainer.classList.add('dial-animating');
        });
        passwordInput.addEventListener('blur', () => {
            vaultSvgContainer.classList.remove('dial-animating');
        });
    </script>
</body>
</html>
