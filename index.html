<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um Presente Especial Para Você</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #4e2053 0%, #973aa8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
        }
        .app-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        .vault-wrapper {
            perspective: 1000px; /* Para efeito 3D na porta */
        }
        .vault-container {
            background-color: rgba(240, 230, 248, 0.92); /* Very light lavender tint */
            padding: 2rem 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            width: 90%;
            max-width: 380px; /* Levemente menor para acomodar melhor o SVG */
            transition: transform 0.7s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.7s ease-out;
            position: relative; /* Para z-index se necessário */
            z-index: 10;
        }

        /* Estilo para o SVG do Cofre */
        .vault-svg-container {
            width: 150px; /* Ajuste conforme necessário */
            height: 150px;
            margin: 0 auto 1.5rem auto;
            position: relative;
        }

        .vault-body { /* fill: #5a5a5a; */ /* Fill now applied directly in SVG via gradient */ }
        .vault-door {
            fill: #707070; 
            stroke: #404040; 
            stroke-width: 2;
            transform-origin: left center; /* Ponto de rotação da porta */
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .vault-door.open {
            transform: rotateY(-110deg) translateX(-5px) scaleX(1.05); /* Efeito de abertura da porta */
        }
        .dial-plate { /* fill: #b0b0b0; */ /* Fill now applied directly in SVG via gradient */ }
        .dial-center { /* fill: #888888; */ /* Fill now applied directly in SVG via gradient */ }
        .handle-base { /* fill: #888888; */ /* Fill now applied directly in SVG via gradient */ }
        .handle-grip {
             /* fill: #5a5a5a; */ /* Fill now applied directly in SVG via gradient */
             /* transition: transform 0.3s ease-in-out; */ /* Replaced by keyframe animation */
        }
        .vault-container.opening .handle-grip {
            /* transform: rotate(90deg); */ /* Replaced by keyframe animation */
            animation: handleTurnAndClick 0.5s ease-out forwards;
            transform-origin: 100px 105px; /* Ensure this is the correct center for the handle grip */
        }
        .hinge { fill: #404040; }


        .romantic-title {
            font-family: 'Pacifico', cursive;
            color: #ffe5b4; /* Pale Gold/Navajo White */
            font-size: 1.75rem;
            margin-bottom: 1.5rem;
        }
        input[type="password"] {
            border: 2px solid #bca0dc; /* Muted Lavender */
            color: #333; /* Ensure text inside is readable */
            background-color: #fdfaff; /* Very light off-white */
            border-radius: 0.5rem;
            padding: 0.75rem;
            width: 100%;
            margin-bottom: 1rem;
            text-align: center;
            font-size: 1.125rem;
            box-sizing: border-box;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: #9e70c9; /* Brighter Lavender */
            box-shadow: 0 0 0 3px rgba(158, 112, 201, 0.4); /* Shadow from focus border */
        }
        .btn-open {
            background-color: #ad6fbf; /* Harmonious purple */
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            width: 100%;
            font-size: 1rem;
        }
        .btn-open:hover {
            background-color: #c388d9; /* Lighter purple for hover */
            transform: translateY(-2px);
        }
        .btn-open:active {
            transform: translateY(0px);
        }

        .message-container {
            text-align: center;
            opacity: 0;
            transform: scale(0.7) translateY(20px);
            transition: opacity 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: absolute; /* Centraliza após o cofre sumir */
            width: 90%;
            max-width: 500px;
            z-index: 5; /* Abaixo do cofre inicialmente */
        }
        .message-container.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        .love-message {
            font-family: 'Pacifico', cursive;
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
            margin-bottom: 2rem;
            line-height: 1.3;
        }
        .heart {
            position: absolute;
            bottom: -60px;
            font-size: 1.2rem; /* Tamanho base */
            color: #ffabcf; /* Light, vibrant pink for new background */
            /* animation: floatUp 4s linear forwards; */ /* Replaced by JS applied animation */
            user-select: none;
            pointer-events: none;
            opacity: 0; /* Começa invisível for JS to trigger fade-in via animation */
        }

        /* @keyframes floatUp { --- Removed as we now use specific types ---
            0% {
                transform: translateY(0) scale(0.7) rotate(0deg);
                opacity: 0.7;
            }
            20% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) scale(1.3) rotate(20deg); 
                opacity: 0;
            }
        } */

        @keyframes heartFloatType1 {
            0% { transform: translateY(0) scale(0.7) translateX(0px) rotate(0deg); opacity: 0; }
            20% { opacity: 1; transform: translateY(-10vh) scale(0.8) translateX(0px) rotate(0deg); }
            100% { transform: translateY(-110vh) scale(1.4) translateX(20px) rotate(15deg); opacity: 0; }
        }
        @keyframes heartFloatType2 {
            0% { transform: translateY(0) scale(0.7) translateX(0px) rotate(0deg); opacity: 0; }
            20% { opacity: 1; transform: translateY(-12vh) scale(0.85) translateX(0px) rotate(0deg); }
            100% { transform: translateY(-105vh) scale(1.3) translateX(-30px) rotate(-10deg); opacity: 0; }
        }
        @keyframes heartFloatType3 {
            0% { transform: translateY(0) scale(0.6) translateX(0px) rotate(0deg); opacity: 0; }
            20% { opacity: 1; transform: translateY(-15vh) scale(0.75) translateX(10px) rotate(5deg); }
            50% { transform: translateY(-50vh) scale(1) translateX(-10px) rotate(-5deg); }
            100% { transform: translateY(-115vh) scale(1.5) translateX(0px) rotate(0deg); opacity: 0; }
        }
        @keyframes heartFloatType4 {
            0% { transform: translateY(0) scale(0.8) translateX(0px) rotate(0deg); opacity: 0; }
            20% { opacity: 1; transform: translateY(-10vh) scale(0.9) translateX(-20px) rotate(-8deg); }
            100% { transform: translateY(-110vh) scale(1.2) translateX(50px) rotate(20deg); opacity: 0; }
        }
        @keyframes heartFloatType5 {
            0% { transform: translateY(0) scale(0.5) translateX(0px) rotate(0deg); opacity: 0; }
            20% { opacity: 1; transform: translateY(-15vh) scale(0.6) translateX(15px) rotate(-15deg); }
            50% { transform: translateY(-60vh) scale(0.8) translateX(-15px) rotate(15deg); }
            100% { transform: translateY(-120vh) scale(1.1) translateX(10px) rotate(-10deg); opacity: 0; }
        }

        .error-message {
            color: #ff8080; /* Lighter red for dark backgrounds */
            font-size: 0.875rem;
            margin-top: 0.5rem;
            height: 1.25rem;
        }

        @media (min-width: 640px) {
            .vault-container {
                padding: 2.5rem 2rem;
            }
            .vault-svg-container {
                width: 180px;
                height: 180px;
            }
            .romantic-title {
                font-size: 2.25rem;
            }
            input[type="password"] {
                font-size: 1.25rem;
            }
            .btn-open {
                font-size: 1.125rem;
            }
            .love-message {
                font-size: 3.5rem;
            }
            .heart {
                font-size: 1.5rem; /* Tamanho base maior */
            }
        }
        /* Animação de shake para erro */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-6px); }
            20%, 40%, 60%, 80% { transform: translateX(6px); }
        }
        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* Keyframes for dial wobble */
        @keyframes dialWobble {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            50% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
            100% { transform: rotate(0deg); }
        }

        /* Apply dial wobble animation when input is focused */
        .vault-svg-container.dial-animating .dial-plate,
        .vault-svg-container.dial-animating #vaultDialMarker {
            animation: dialWobble 0.7s ease-in-out infinite;
            transform-origin: 100px 100px; /* SVG coordinates for dial center */
        }

        /* Keyframes for enhanced handle turn */
        @keyframes handleTurnAndClick {
            0% { transform: rotate(0deg) scale(1); }
            70% { transform: rotate(145deg) scale(1.1); } /* Overshoot rotation slightly and scale up */
            90% { transform: rotate(130deg) scale(1.05); } /* Bounce back rotation */
            100% { transform: rotate(135deg) scale(1); } /* Settle to final rotation */
        }

        /* Keyframes for message pulsing/glowing effect */
        @keyframes pulseGlow {
            0% { text-shadow: 2px 2px 8px rgba(0,0,0,0.6), 0 0 10px rgba(230, 190, 255, 0.5); } /* Soft Lavender glow */
            50% { text-shadow: 2px 2px 12px rgba(0,0,0,0.7), 0 0 25px rgba(230, 190, 255, 0.9); } /* Brighter Lavender glow */
            100% { text-shadow: 2px 2px 8px rgba(0,0,0,0.6), 0 0 10px rgba(230, 190, 255, 0.5); }
        }

        .love-message.message-pulsing {
            animation: pulseGlow 2s ease-in-out infinite;
        }

        .confetti-particle {
            position: fixed;
            pointer-events: none;
            z-index: 1000; /* Ensure confetti is on top */
        }

        @keyframes confettiFallType1 { /* Gentle fall with slight sway */
            0% { transform: translateY(0px) translateX(0px) rotateZ(0deg) scale(1); opacity: 1; }
            20% { transform: translateY(-30px) translateX(10px) rotateZ(45deg) scale(0.9); opacity: 1; }
            100% { transform: translateY(110vh) translateX(30px) rotateZ(180deg) scale(0.3); opacity: 0; }
        }
        @keyframes confettiFallType2 { /* Faster fall, more rotation */
            0% { transform: translateY(0px) translateX(0px) rotateZ(0deg) scale(1); opacity: 1; }
            15% { transform: translateY(-40px) translateX(-15px) rotateZ(90deg) scale(0.85); opacity: 1; }
            100% { transform: translateY(110vh) translateX(-50px) rotateZ(720deg) scale(0.25); opacity: 0; }
        }
        @keyframes confettiFallType3 { /* Wider horizontal movement */
            0% { transform: translateY(0px) translateX(0px) rotateZ(0deg) scale(1); opacity: 1; }
            25% { transform: translateY(-20px) translateX(30px) rotateZ(-30deg) scale(0.95); opacity: 1; }
            100% { transform: translateY(110vh) translateX(150px) rotateZ(360deg) scale(0.35); opacity: 0; }
        }
        @keyframes confettiFallType4 { /* Opposite wider horizontal movement */
            0% { transform: translateY(0px) translateX(0px) rotateZ(0deg) scale(1); opacity: 1; }
            25% { transform: translateY(-25px) translateX(-35px) rotateZ(60deg) scale(0.9); opacity: 1; }
            100% { transform: translateY(110vh) translateX(-120px) rotateZ(270deg) scale(0.3); opacity: 0; }
        }
        @keyframes confettiFallType5 { /* More erratic, quicker fade */
            0% { transform: translateY(0px) translateX(0px) rotateZ(0deg) scale(1); opacity: 1; }
            20% { transform: translateY(-35px) translateX(5px) rotateZ(-45deg) scale(0.8); opacity: 1; }
            80% { opacity: 0.5; } /* Start fading earlier */
            100% { transform: translateY(105vh) translateX(10px) rotateZ(540deg) scale(0.2); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="appContainer" class="app-container">
        <div class="vault-wrapper">
            <div id="vaultContainer" class="vault-container">
                <div class="vault-svg-container">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
                        <defs>
                            <linearGradient id="vaultFrontGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#787878;" />
                                <stop offset="100%" style="stop-color:#484848;" />
                            </linearGradient>
                            <linearGradient id="vaultTopGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" style="stop-color:#888888;" />
                                <stop offset="100%" style="stop-color:#686868;" />
                            </linearGradient>
                            <linearGradient id="vaultSideGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" style="stop-color:#505050;" />
                                <stop offset="100%" style="stop-color:#303030;" />
                            </linearGradient>
                            <radialGradient id="dialPlateRadialGradient" cx="50%" cy="50%" r="65%" fx="35%" fy="35%">
                                <stop offset="0%" style="stop-color:#d0d0d0;" />  <!-- Lighter center highlight -->
                                <stop offset="60%" style="stop-color:#b0b0b0;" /> <!-- Main color -->
                                <stop offset="100%" style="stop-color:#909090;" /> <!-- Darker edge -->
                            </radialGradient>
                            <radialGradient id="dialCenterGradient" cx="50%" cy="50%" r="70%" fx="30%" fy="30%">
                                <stop offset="0%" style="stop-color:#aaaaaa;" />  <!-- Highlight for center -->
                                <stop offset="100%" style="stop-color:#707070;" /> <!-- Darker edge for center -->
                            </radialGradient>
                            <linearGradient id="handleBaseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" style="stop-color:#989898;" /> <!-- Lighter edge for handle base -->
                                <stop offset="50%" style="stop-color:#808080;" />
                                <stop offset="100%" style="stop-color:#707070;" /> <!-- Darker edge for handle base -->
                            </linearGradient>
                            <linearGradient id="handleGripGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" style="stop-color:#707070;" /> <!-- Lighter top for handle grip -->
                                <stop offset="50%" style="stop-color:#5a5a5a;" /> <!-- Original color -->
                                <stop offset="100%" style="stop-color:#484848;" /> <!-- Darker bottom for handle grip -->
                            </linearGradient>
                        </defs>

                        {/* Side Facet Path (right side) */}
                        <path d="M180,20 L190,10 L190,170 L180,180 Z" fill="url(#vaultSideGradient)" stroke="#303030" stroke-width="0.5"/>
                        
                        {/* Top Facet Path */}
                        <path d="M20,20 L10,10 L170,10 L180,20 Z" fill="url(#vaultTopGradient)" stroke="#404040" stroke-width="0.5"/>

                        {/* Existing vault body - now the FRONT face, with gradient */}
                        <rect x="20" y="20" width="160" height="160" rx="10" class="vault-body" fill="url(#vaultFrontGradient)"/>
                        
                        <rect id="vaultDoorSvg" x="25" y="25" width="150" height="150" rx="5" class="vault-door"/>
                        <rect x="18" y="40" width="10" height="20" rx="2" class="hinge"/>
                        <rect x="18" y="140" width="10" height="20" rx="2" class="hinge"/>
                        <circle cx="100" cy="100" r="35" class="dial-plate" fill="url(#dialPlateRadialGradient)"/>
                        <circle cx="100" cy="100" r="15" class="dial-center" fill="url(#dialCenterGradient)"/>
                        <line id="vaultDialMarker" x1="100" y1="70" x2="100" y2="80" stroke="#333333" stroke-width="3"/>
                        <rect x="95" y="90" width="10" height="30" rx="2" class="handle-base" transform="translate(50, 15)" fill="url(#handleBaseGradient)"/> 
                        <rect id="handleGripSvg" x="85" y="115" width="30" height="10" rx="3" class="handle-grip" transform="translate(50, 15)" fill="url(#handleGripGradient)"/> </svg>
                </div>
                <h1 class="romantic-title">Um Segredo Para Você</h1>
                <input type="password" id="passwordInput" placeholder="Digite a senha especial">
                <div id="errorMessage" class="error-message"></div>
                <button id="openVaultButton" class="btn-open">Abrir o Cofre</button>
            </div>
        </div>

        <div id="messageContainer" class="message-container">
            <h2 id="loveMessageText" class="love-message">Eu te amo infinitamente!</h2>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('passwordInput');
        const openVaultButton = document.getElementById('openVaultButton');
        const vaultContainer = document.getElementById('vaultContainer');
        const messageContainer = document.getElementById('messageContainer');
        const loveMessageText = document.getElementById('loveMessageText');
        const errorMessage = document.getElementById('errorMessage');
        const vaultDoorSvg = document.getElementById('vaultDoorSvg');
        const handleGripSvg = document.getElementById('handleGripSvg'); // Para animar a maçaneta
        const vaultSvgContainer = document.querySelector('.vault-svg-container'); // For dial animation
        const correctPassword = "280921";

        const confettiColors = ['#ffd700', '#c0c0c0', '#f8b4ff', '#a9def9', '#eccaff', '#ffb3ba'];

        function createConfettiParticle() {
            const particle = document.createElement('div');
            particle.classList.add('confetti-particle');
            
            particle.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
            const size = Math.random() * 7 + 8; // width/height between 8px and 15px
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';

            const messageRect = messageContainer.getBoundingClientRect();
            // Start confetti from roughly the center of where the vault was, or top of message area
            particle.style.left = (messageRect.left + messageRect.width / 2) + 'px'; 
            particle.style.top = (messageRect.top + messageRect.height / 3) + 'px';


            document.body.appendChild(particle);
            
            const confettiAnimationNames = ['confettiFallType1', 'confettiFallType2', 'confettiFallType3', 'confettiFallType4', 'confettiFallType5'];
            const animationName = confettiAnimationNames[Math.floor(Math.random() * confettiAnimationNames.length)];
            const duration = (Math.random() * 2 + 2.5) + 's'; // Duration 2.5-4.5s (as before)

            particle.style.animation = `${animationName} ${duration} linear forwards`;

            particle.addEventListener('animationend', () => {
                particle.remove();
            });
        }


        function createHeart() {
            const heartEmojis = ['❤️', '💖', '💕', '💓', '💗'];
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];

            heart.style.left = Math.random() * 100 + 'vw';
            // const randomScale = Math.random() * 0.8 + 0.8; // No longer used directly to set transform scale here
            
            const heartAnimationNames = ['heartFloatType1', 'heartFloatType2', 'heartFloatType3', 'heartFloatType4', 'heartFloatType5'];
            const animationName = heartAnimationNames[Math.floor(Math.random() * heartAnimationNames.length)];
            
            const duration = (Math.random() * 3 + 3.5) + 's'; // 3.5s to 6.5s (as before)
            const delay = (Math.random() * 0.5) + 's'; // (as before)
            
            heart.style.animation = `${animationName} ${duration} linear ${delay} 1 forwards`;

            document.body.appendChild(heart);

            heart.addEventListener('animationend', () => {
                heart.remove();
            });
        }

        openVaultButton.addEventListener('click', () => {
            if (passwordInput.value === correctPassword) {
                errorMessage.textContent = '';
                vaultContainer.classList.add('opening'); // Adiciona classe para animar a maçaneta
                vaultDoorSvg.classList.add('open'); // Abre a porta do SVG

                // Atraso para a animação da porta acontecer antes do cofre sumir
                setTimeout(() => {
                    vaultContainer.style.transform = 'scale(0.7) rotateY(30deg)'; // Efeito de sumiço mais interessante
                    vaultContainer.style.opacity = '0';

                    setTimeout(() => {
                        vaultContainer.style.display = 'none';
                        messageContainer.classList.add('visible');
                        
                        const fullMessage = "Eu te amo infinitamente!";
                        loveMessageText.textContent = ''; // Clear current text for typing animation
                        let i = 0;
                        function typeCharacter() {
                            if (i < fullMessage.length) {
                                loveMessageText.textContent += fullMessage.charAt(i);
                                i++;
                                setTimeout(typeCharacter, 120); // Adjust typing speed (ms)
                            } else {
                                // Typing finished, add the pulsing effect class
                                loveMessageText.classList.add('message-pulsing');
                            }
                        }
                        typeCharacter(); // Start typing animation
                
                const numConfetti = 80; // Number of confetti particles
                for (let i = 0; i < numConfetti; i++) {
                    setTimeout(createConfettiParticle, i * 25); // Stagger their creation
                }

                        for(let i=0; i<15; i++) { setTimeout(createHeart, i * 100); } // Cria corações iniciais com um pequeno stagger
                        const heartInterval = setInterval(createHeart, 250); // Cria novos corações

                        // Opcional: parar de criar corações depois de um tempo
                        // setTimeout(() => clearInterval(heartInterval), 20000); // Para após 20 segundos
                    }, 700); // Tempo para o cofre sumir após a porta abrir

                }, 600); // Tempo para a porta do SVG abrir

            } else {
                errorMessage.textContent = 'Senha incorreta, tente novamente!';
                passwordInput.classList.add('animate-shake');
                setTimeout(() => {
                    passwordInput.classList.remove('animate-shake');
                }, 400);
                passwordInput.value = '';
                passwordInput.focus();
            }
        });

        passwordInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                openVaultButton.click();
            }
        });

        // Dial animation on input focus/blur
        passwordInput.addEventListener('focus', () => {
            vaultSvgContainer.classList.add('dial-animating');
        });
        passwordInput.addEventListener('blur', () => {
            vaultSvgContainer.classList.remove('dial-animating');
        });
    </script>
</body>
</html>
